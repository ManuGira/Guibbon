name: Guibbon CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: 'ubuntu-latest'
    name: Linter and type checker

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check code formatting with ruff
        id: ruff
        run: |
          uv add --dev ruff
          uv run ruff check .
        continue-on-error: true

      - name: Type check with ty
        id: ty
        run: |
          uv add --dev ty
          uv run ty check .
        continue-on-error: true

      - name: Check lint results
        if: steps.ruff.outcome == 'failure' || steps.ty.outcome == 'failure'
        run: |
          echo "❌ Linting failed:"
          if [ "${{ steps.ruff.outcome }}" == "failure" ]; then
            echo "  - Ruff found issues (see 'Check code formatting with ruff' for details)"
          fi
          if [ "${{ steps.ty.outcome }}" == "failure" ]; then
            echo "  - Ty found issues (see 'Type check with ty' for details)"
          fi
          exit 1

  tests-ubuntu:
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: 'ubuntu-latest'

    name: "Tests: ubuntu-latest, py ${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install tkinter
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python version ${{ matrix.python-version }}
        run: |
          uv python pin ${{ matrix.python-version }}

      - name: Run tests
        run: |
          echo "Create virtual display to avoid tk/tcl errors on ubuntu"
          export DISPLAY=:99 
          Xvfb :99 &  
          echo "Running tests"
          uv run pytest
